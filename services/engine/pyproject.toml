[project]
name = "securepitch-engine"
version = "0.1.0"
description = "SecurePitch engine: in-memory statement processing, roster matching and dossier sealing"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.35",
    "cryptography>=44",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "pikepdf>=9",
    "rfc8785>=0.1.4",
    "uvicorn[standard]>=0.32",
    "webauthn>=2.5",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "reportlab>=4.2",
    "ruff==0.11.8",  # same version as the pre-commit hook
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE"]
ignore = ["S101"] # assert is fine in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
