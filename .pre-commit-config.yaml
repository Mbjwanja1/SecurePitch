# Runs on every `git commit`. Install once per clone with:
#   pre-commit install
# Run against the whole repo with:
#   pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Work happens on feature branches; main changes only through pull requests.
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  # Secrets and Kenyan phone numbers in staged changes (rules in .gitleaks.toml).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks

  # Python lint and format for services/engine and tools/.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # Case-insensitive: phones and email exports produce names like MPESA_Statement.PDF.
      - id: block-real-financial-files
        name: block statements and spreadsheets outside fixtures/synthetic
        language: fail
        entry: >-
          Statements and rosters must not be committed. Real files belong in
          fixtures/private/ (git-ignored); synthetic test files go in fixtures/synthetic/.
        files: (?i)\.(pdf|csv|tsv|xlsx|xls|ods)$
        exclude: ^fixtures/synthetic/
      # Receipt and roster photos are personal data, and gitleaks can't read images.
      # Only app icons, page images and dossier template assets may be committed.
      - id: block-photos
        name: block photos outside app asset folders
        language: fail
        entry: >-
          Photos may contain receipts, rosters or faces. Real ones belong in fixtures/private/.
          If this is an app asset, put it in apps/web/public/, apps/web/app/ or
          services/engine/app/dossier/templates/assets/.
        files: (?i)\.(jpe?g|png|heic|heif|webp|gif|bmp|tiff?)$
        exclude: ^(fixtures/synthetic|apps/web/public|apps/web/app|services/engine/app/dossier/templates/assets)/
