# Gitleaks configuration for SecurePitch.
# Runs in the pre-commit hook (staged changes) and in CI (full history).

title = "SecurePitch"

# Keep all of gitleaks' built-in rules (AWS keys, Supabase/JWT tokens, private keys, ...).
# These apply everywhere, including fixtures/synthetic/.
[extend]
useDefault = true

# Real player and coach numbers must never be committed. The roster is stored only as HMAC
# digests, and the HMAC key lives in the engine's environment (later KMS), never in the
# database, so a phone number in git is always a leak.
# Matches 0712345678, 0712 345 678, 0712-345-678, 254712345678 and +254 712 345 678
# (07xx and 01xx prefixes).
[[rules]]
id = "kenyan-mobile-number"
description = "Kenyan mobile number (possible personal data)"
regex = '''(?:^|[^0-9A-Za-z])((?:\+?254|0)[ -]?[17][0-9]{2}[ -]?[0-9]{3}[ -]?[0-9]{3})(?:$|[^0-9A-Za-z])'''
secretGroup = 1
keywords = ["07", "01", "254"]

  # Exempt from the phone rule only (every other rule still scans these paths):
  # made-up numbers in synthetic fixtures, and base64 integrity hashes in lockfiles.
  # "(^|/)" matches whether gitleaks reports repo-relative or absolute paths.
  [[rules.allowlists]]
  description = "Synthetic fixtures and package lockfiles"
  paths = [
    '''(^|/)fixtures/synthetic/''',
    '''(^|/)pnpm-lock\.yaml$''',
    '''(^|/)uv\.lock$''',
  ]

# WebAuthn authenticatorData is public by design: it travels in every sealed dossier a sponsor
# downloads (docs/CRYPTO_SPEC.md section 5) and holds only an RP ID hash, flags and a counter.
# Its base64url form trips the generic API-key rule in spec/test-vectors.json. Only lines that
# are exactly this JSON field are exempt; every rule still scans everything else.
[allowlist]
description = "WebAuthn authenticatorData fields (public, not secrets)"
regexTarget = "line"
regexes = ['''^\s*"authenticatorData": "[A-Za-z0-9_-]+",?\s*$''']
